[package]
name = "flupmix"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voicemeeter-style audio mixer for Linux (PipeWire, GPUI)"

[dependencies]
flupmix-core = { path = "../flupmix-core" }
flupmix-engine = { path = "../flupmix-engine" }
flupmix-ui = { path = "../flupmix-ui" }
ksni = { version = "0.3.7", features = ["blocking"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
