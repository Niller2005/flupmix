name: Prepare release

# Run from the Actions tab with a version like 0.6.0. It rolls the Unreleased
# changelog section into that version, bumps Cargo.toml and Cargo.lock, commits
# to main and pushes the tag, which starts the Release workflow (that workflow
# runs CI itself before publishing anything).
#
# Needs a repository secret RELEASE_TOKEN: a fine-grained personal access token
# with "Contents: read and write" on this repository. Pushes made with the
# default GITHUB_TOKEN do not trigger other workflows, so the tag would never
# start a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. 0.6.0 (no leading v)'
        required: true
        type: string

permissions:
  contents: read

concurrency: prepare-release

jobs:
  prepare:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Check tag is free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists"
            exit 1
          fi

      - name: Bump version and roll changelog
        env:
          VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/prepare_release.py "$VERSION" --repo "$GITHUB_REPOSITORY"

      - name: Update Cargo.lock
        run: cargo update --workspace

      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): $version"
          git tag -a "v$version" -m "flupmix $version"
          git push origin HEAD:main "v$version"
