name: Release

# Push a tag like v0.1.0 (matching the workspace version and a CHANGELOG.md
# section). Jobs: meta -> ci (reusable) -> tarball + appimage -> publish.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Check tag, version and changelog
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$version" != "$crate_version" ]; then
            echo "::error::tag $tag does not match workspace version $crate_version"
            exit 1
          fi
          # Release notes: the CHANGELOG section for this version.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  ci:
    name: CI
    needs: meta
    uses: ./.github/workflows/ci.yml

  tarball:
    name: Tarball
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flupmix-binary
          path: target/release
      - name: Package
        run: |
          name="flupmix-${GITHUB_REF_NAME}-x86_64-linux"
          chmod +x target/release/flupmix
          mkdir -p "dist/$name/assets"
          cp target/release/flupmix "dist/$name/flupmix"
          strip "dist/$name/flupmix"
          cp install.sh LICENSE README.md CHANGELOG.md "dist/$name/"
          cp assets/flupmix.svg assets/flupmix.desktop "dist/$name/assets/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-tarball
          path: dist/*
          retention-days: 1

  appimage:
    name: AppImage
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flupmix-binary
          path: target/release
      - name: Build AppImage
        run: |
          chmod +x target/release/flupmix
          packaging/appimage.sh "${GITHUB_REF_NAME}" dist
          img="flupmix-${GITHUB_REF_NAME}-x86_64.AppImage"
          (cd dist && sha256sum "$img" > "$img.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: dist-appimage
          path: dist/*
          retention-days: 1

  publish:
    name: Publish release
    needs: [meta, tarball, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.meta.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: dist/*
