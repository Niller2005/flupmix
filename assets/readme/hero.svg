    <text x="52" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-3" fill="#ffffff">flup<tspan fill="#5ef1ff">·mix</tspan></text>
    <text x="56" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#b4bcd0">Voicemeeter-style mixing for Linux,</text>
    <text x="56" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#b4bcd0">built on PipeWire, a fader for every app.</text>
    <text x="56" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1" fill="#2aa5b3">STRIPS → MIXER → BUSES</text>
  </g>
