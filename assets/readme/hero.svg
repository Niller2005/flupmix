<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">flupmix</title>
  <desc id="desc">flup·mix: a Voicemeeter-style audio mixer for Linux built on PipeWire, shown as five input strips feeding a hardware bus and a virtual microphone bus.</desc>
  <rect width="1200" height="400" rx="26" fill="#000000"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="25.5" fill="none" stroke="#3c4048"/>
