<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">flupmix signal flow</title>
  <desc id="desc">Applications play into virtual sink strips. All strips and capture sources enter one PipeWire mixer node, which feeds a hardware headphone bus and virtual microphone buses that other apps can record.</desc>
